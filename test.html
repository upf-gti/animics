<script type="module">

import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { TransformControls } from "three/addons/controls/TransformControls.js";
import mlSavitzkyGolay from 'https://cdn.skypack.dev/ml-savitzky-golay';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e1e24);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
camera.position.set(0, 1.2, 3.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;

const grid = new THREE.GridHelper(10, 20, 0x444444, 0x222222);
grid.position.y = -0.5;
scene.add(grid);

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(2, 4, 3);
scene.add(light, new THREE.AmbientLight(0xffffff, 0.4));

// Hand helper (normal yellow arrow)
const handGroup = new THREE.Group();
const arrowFront = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0.02,0), 0.1, 0xffff00);
handGroup.add(arrowFront);

// Hand helper (normal computed red arrow)
const arrowFrontComputed = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0.02,0), 0.1, 0xff0000);
scene.add(arrowFrontComputed);
// Hand helper (normal local computed pink arrow)
const arrowFrontLocalComputed = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0.02,0), 0.1, 0xff00ff);
handGroup.add(arrowFrontLocalComputed);

// Hand helper (normal real bone local computed white arrow)
const arrowFrontBoneLocalComputed = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0.02,0), 0.1, 0xffffff);
handGroup.add(arrowFrontBoneLocalComputed);

// Interactive Target (MEDIAPIPE)
const targetMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.03),
    new THREE.MeshBasicMaterial({ color: 0xff2222 })
);
scene.add(targetMesh);

const transformControls = new TransformControls(camera, renderer.domElement);
transformControls.attach(targetMesh);
transformControls.setSize(0.7);
transformControls.addEventListener('dragging-changed', (e) => orbit.enabled = !e.value);
const gizmo = transformControls.getHelper();
scene.add( gizmo );

const lineGeom = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
const targetLine = new THREE.Line(lineGeom, new THREE.LineBasicMaterial({ color: 0x00ff00 }));
scene.add(targetLine);

// "Mediapipe landmarks" helpers
const geometry = new THREE.BoxGeometry( 1, 1, 1 );
const material = new THREE.MeshBasicMaterial( { color: 0x00ff00, depthTest: false, depthWrite: false, transparent: true} );
const handWorld = new THREE.Mesh( geometry, material );
handWorld.scale.set(0.01, 0.01, 0.01);
scene.add( handWorld );
const midWorld = new THREE.Mesh( geometry, material.clone() );
midWorld.scale.set(0.01, 0.01, 0.01);
midWorld.material.color.set(0xff0000);
scene.add( midWorld );
const indexWorld = new THREE.Mesh( geometry, material.clone() );
indexWorld.material.color.set(0xffff00);
indexWorld.scale.set(0.01, 0.01, 0.01);
scene.add( indexWorld );
const pinkyWorld = new THREE.Mesh( geometry, material.clone() );
pinkyWorld.material.color.set(0x0000ff);
pinkyWorld.scale.set(0.01, 0.01, 0.01);
scene.add( pinkyWorld );

let skeleton = null;
const loader = new GLTFLoader();

let frame = 0;
let timeAcc = 0;

let isLeft = true;
let boneHand = null;
let boneMid = null;
let bonePinky = null;
let boneIndex = null;
let boneForearm = null


let landmarks = null;
let bindQuats = [];
let computeTwist = true;

async function init () {

    const gltf = await loader.loadAsync( 'https://resources.gti.upf.edu/3Dcharacters/Eva_Low/Eva_Low.glb' );
    const model = gltf.scene;
    model
    model.traverse( o => {
        if (o.isMesh || o.isSkinnedMesh) {
            o.castShadow = true;
            o.receiveShadow = true;
            o.frustumCulled = false;
            if ( o.skeleton ){ 
                skeleton = o.skeleton;
            }
            if (o.name == "Body") {
                o.name == "BodyMesh";
            }
            
            if(o.name == "Classic_short") {
                if( o.children.length > 1 ){ 
                    o.children[1].renderOrder = 1; 
                }
            }
            if(o.name.includes("Eyelashes")) {
                o.castShadow = false;
            }
            o.material.side = THREE.FrontSide;                    
        }
    } );
    scene.add( model );
    
    // Skeleton and geometry
    
    boneHand = isLeft ? skeleton.bones[ 12 ] : skeleton.bones[ 36 ];
    boneMid = isLeft ? skeleton.bones[ 21 ] : skeleton.bones[ 45 ];
    bonePinky = isLeft ? skeleton.bones[ 29 ] : skeleton.bones[ 37 ];
    boneIndex = isLeft ? skeleton.bones[ 17 ] : skeleton.bones[ 49 ];
    boneForearm = boneHand.parent;
    boneHand.add(handGroup);

    boneHand.getWorldPosition(handWorld.position);
    boneIndex.getWorldPosition(indexWorld.position);
    boneMid.getWorldPosition(midWorld.position);
    boneMid.getWorldPosition(targetMesh.position);
    bonePinky.getWorldPosition(pinkyWorld.position);
    boneHand.getWorldPosition(arrowFrontComputed.position);
    
    // targetMesh.position.x+=0.1
    // targetMesh.position.y-=0.1
    animate();
}

// Animation loop
function animate() {
    requestAnimationFrame(animate);

    const handWorldPos = new THREE.Vector3();
    boneHand.getWorldPosition(handWorldPos);

    const midTargetPos = targetMesh.position.clone();
    const mcMidDir = new THREE.Vector3().subVectors(midTargetPos, handWorldPos).normalize();

    // Mediapipe twist simulation
    // 1. Find side direction perpendicular to middle finger
    let defaultUp = new THREE.Vector3(0, -1, 0);
    if (mcMidDir.y > 0.95) defaultUp.set(1, 0, 0);
    if (mcMidDir.y < -0.95) defaultUp.set(-1, 0, 0);
    if (mcMidDir.x < 0 && mcMidDir.y > 0.5) defaultUp.set(0, 1, 0);
    if (mcMidDir.x > 0 && mcMidDir.y < -0.5) defaultUp.set(0, -1, 0);
    
    let baseSideDir = new THREE.Vector3().crossVectors(mcMidDir, defaultUp).normalize();

    // 2. Apply twist from slider rotating side vector around finger vector
    const twistAngleRad = THREE.MathUtils.degToRad(parseFloat(twistSlider.value));
    let rotatedSideDir = baseSideDir.clone().applyAxisAngle(mcMidDir, twistAngleRad);

    // 3. Mediapipe simulation landmarks: Index [5] and Pinky [17]
    let simulatedHandLandmarks = {
        0: handWorldPos,
        9: midTargetPos,
        5: handWorldPos.clone().add(mcMidDir.clone().multiplyScalar(0.1)).sub(rotatedSideDir.clone().multiplyScalar(0.05)),
        17: handWorldPos.clone().add(mcMidDir.clone().multiplyScalar(0.1)).add(rotatedSideDir.clone().multiplyScalar(0.05))
    };
    if( landmarks ) {
        simulatedHandLandmarks = landmarks;
        if(landmarks[frame].RWLM) {
            warning.innerText = "";
            const handPos = boneHand.getWorldPosition(new THREE.Vector3());
            
            handWorld.position.copy(landmarks[frame].RWLM[0]).add(handPos)
            midWorld.position.copy(landmarks[frame].RWLM[9]).add(handPos)
            indexWorld.position.copy(landmarks[frame].RWLM[5]).add(handPos)
            pinkyWorld.position.copy(landmarks[frame].RWLM[17]).add(handPos)
        }
        else {
            warning.innerText = "No landmarks detected";
        }
    }
    else {
        handWorld.position.copy(simulatedHandLandmarks[0]);
        midWorld.position.copy(simulatedHandLandmarks[9]);
        indexWorld.position.copy(simulatedHandLandmarks[5]);
        pinkyWorld.position.copy(simulatedHandLandmarks[17]);
    }
        
    // Update target line (green)
    targetLine.geometry.setFromPoints([handWorldPos, midTargetPos]);

    // Compute hand rotations
    // const metrics = computeQuatHand(skeleton, simulatedHandLandmarks, isLeft);
    // const metrics = computeQuatHandOriginal(skeleton, simulatedHandLandmarks, isLeft);
    let metrics = null;
    if(landmarks) {
        
        if(recompute) {
                warning2.innerText = ""
            metrics = createBodyAnimationFromWorldLandmarks(landmarks, skeleton, frame, bindQuats)
            recompute = false;
            if( !metrics ) {
                warning2.innerText = "Discarted frame";
            }
        }
    }
    else {
        metrics = computeQuatHandOriginal(skeleton, simulatedHandLandmarks, isLeft);
    }
    // Update GUI
    if (metrics) {
        document.getElementById('valSwingReq').innerText = metrics.swingReq;
        
        const elSwingReal = document.getElementById('valSwingReal');
        elSwingReal.innerText = metrics.swingReal;
        elSwingReal.className = (parseFloat(metrics.swingReq) > 60.1) ? "metric warn" : "metric ok";

        document.getElementById('valTwistReq').innerText = metrics.twistReq;
        
        const elTwistReal = document.getElementById('valTwistReal');
        elTwistReal.innerText = metrics.twistReal;
        elTwistReal.className = (Math.abs(parseFloat(metrics.twistReq)) > 35.1) ? "metric warn" : "metric ok";
    }

    orbit.update();
    renderer.render(scene, camera);
}

const SKEL_FOREARM = 0, SKEL_HAND = 1, SKEL_MID = 2, SKEL_PINKY = 3, SKEL_INDEX = 4;

function computeQuatHandOriginal( skeleton, handLandmarks, isLeft = false ){
    if ( !handLandmarks ){ return; }
    //handlandmarks is an array of {x,y,z,visiblity} (mediapipe)
        
    const boneHand = isLeft? skeleton.bones[ 12 ] : skeleton.bones[ 36 ];
    const boneMid = isLeft? skeleton.bones[ 21 ] : skeleton.bones[ 45 ];
    // const boneThumbd = isLeft? skeleton.bones[ 13 ] : skeleton.bones[ 53 ];
    const bonePinky = isLeft? skeleton.bones[ 29 ] : skeleton.bones[ 37 ];
    const boneIndex = isLeft? skeleton.bones[ 17 ] : skeleton.bones[ 49 ];
    
    // boneHand has a ~90º local rotation on the bindPose
    boneHand.updateWorldMatrix( true, false );

    if (!boneHand.userData.bindPoseData) {
        // Matrius World Inverses originals
        let invHandMat = isLeft ? skeleton.boneInverses[ 12 ].clone() : skeleton.boneInverses[ 36 ].clone();
        let invParentMat = isLeft ? skeleton.boneInverses[ 11 ].clone() : skeleton.boneInverses[ 35 ].clone();
        let invMidMat = isLeft ? skeleton.boneInverses[ 21 ].clone() : skeleton.boneInverses[ 45 ].clone();

        // Local rotation of the hand in bind pose respect to parent (forearm)
        let handBindMatLocal = invParentMat.clone().multiply( invHandMat.clone().invert() );
        let dummyPos = new THREE.Vector3(), dummyScale = new THREE.Vector3();
        let bindPoseQuat = new THREE.Quaternion();
        handBindMatLocal.decompose(dummyPos, bindPoseQuat, dummyScale);

        // Local position of the middle finger in bind pose respect to the hand
        // World matrix of the hand in bind pose
        let handWorldBindMat = invHandMat.clone().invert(); 
        // World matrix of the middle finger in bind pose
        let midWorldBindMat = invMidMat.clone().invert();   
        
        // Local matrix of the middle finger respect to the hand in bind pose
        let midLocalBindMat = invHandMat.clone().multiply( midWorldBindMat );
        
        let bindMidLocalPos = new THREE.Vector3();
        let bindMidLocalQuat = new THREE.Quaternion();
        midLocalBindMat.decompose(bindMidLocalPos, bindMidLocalQuat, dummyScale);

        // Save pure data of bind pose
        boneHand.userData.bindPoseData = {
            bindPoseQuat: bindPoseQuat,                             // local neutral rotation of hand
            dirMidBoneBind: bindMidLocalPos.clone().normalize(),     // original direcction vector of the middle finger in bind pose
            bindMidLocalQuat: bindMidLocalQuat,
            lastRawTwist: 0
        };
    }

    const bindData = boneHand.userData.bindPoseData;
    const { bindPoseQuat, dirMidBoneBind } = bindData;

    let _ignoreVec3 = new THREE.Vector3();
    let invWorldQuat = new THREE.Quaternion();
    boneHand.matrixWorld.decompose( _ignoreVec3, invWorldQuat, _ignoreVec3 ); // get L to W quat
    // console.log("world", THREE.MathUtils.radToDeg(2 * Math.acos(Math.min(Math.abs(invWorldQuat.w), 1.0))))
    // console.log("world axis", new THREE.Vector3(invWorldQuat.x, invWorldQuat.y, invWorldQuat.z).normalize())
    // const euler = new THREE.Euler().setFromQuaternion(invWorldQuat);
    // console.log("euler", THREE.MathUtils.radToDeg(euler.x), THREE.MathUtils.radToDeg(euler.y), THREE.MathUtils.radToDeg(euler.z) )

    // console.log("local", THREE.MathUtils.radToDeg(2 * Math.acos(Math.min(Math.abs(boneHand.quaternion.w), 1.0))))
    // console.log("local axis", new THREE.Vector3(boneHand.quaternion.x, boneHand.quaternion.y, boneHand.quaternion.z).normalize())
    const euler = new THREE.Euler().setFromQuaternion(boneHand.quaternion);
    // console.log("euler", THREE.MathUtils.radToDeg(euler.x), THREE.MathUtils.radToDeg(euler.y), THREE.MathUtils.radToDeg(euler.z) )

    invWorldQuat.invert(); // W to L

    // metacarpian middle finger 
    let mcMidPred = new THREE.Vector3(); 
    mcMidPred.subVectors( handLandmarks[9], handLandmarks[0] ); // world
    mcMidPred.applyQuaternion( invWorldQuat ).normalize(); // hand local space
    
    //swing (with unwanted twist)
    let dirBone = boneMid.position.clone().normalize();
    let qq = new THREE.Quaternion();
    qq.setFromUnitVectors( dirBone, mcMidPred );
    // console.log(THREE.MathUtils.radToDeg(2 * Math.acos(Math.min(Math.abs(boneHand.quaternion.w), 1.0))))
    boneHand.quaternion.multiply( qq );
    
    let swingAngleReq = 2 * Math.acos(Math.min(Math.abs(qq.w), 1.0));
    invWorldQuat.premultiply( qq.invert() ); // update hand's world to local quat

    // twist
    let mcPinkyPred = (new THREE.Vector3()).subVectors( handLandmarks[17], handLandmarks[0] );
    let mcIndexPred = (new THREE.Vector3()).subVectors( handLandmarks[5], handLandmarks[0] );
    let palmDirPred = (new THREE.Vector3()).crossVectors(mcPinkyPred, mcIndexPred).normalize(); // world space

    arrowFrontComputed.setDirection(palmDirPred)
    palmDirPred.applyQuaternion( invWorldQuat ).normalize(); // local space
    arrowFrontLocalComputed.setDirection(palmDirPred)

    let palmDirBone = (new THREE.Vector3()).crossVectors(bonePinky.position, boneIndex.position).normalize(); // local space. Cross product "does not care" about input sizes
    arrowFrontBoneLocalComputed.setDirection(palmDirBone)
    qq.setFromUnitVectors( palmDirBone, palmDirPred ).normalize();
    let continuousTwistAngle = 2 * Math.acos(Math.min(Math.abs(qq.w), 1.0));
    boneHand.quaternion.multiply( qq ).normalize();
    
    console.log("total diff angle:", THREE.MathUtils.radToDeg(2 * Math.acos(Math.min(Math.abs(boneHand.quaternion.w), 1.0))))
    const q = bindPoseQuat.clone().invert().multiply( boneHand.quaternion ).normalize();
    continuousTwistAngle = 2 * Math.acos(Math.min(Math.abs(q.w), 1.0));
    console.log("total angle (without bind):", THREE.MathUtils.radToDeg(2 * Math.acos(Math.min(Math.abs(boneHand.quaternion.w), 1.0))))
    
    return {
        swingReq: THREE.MathUtils.radToDeg(swingAngleReq).toFixed(1),
        swingReal: 0,//THREE.MathUtils.radToDeg(swingAngleApplied).toFixed(1),
        twistReq: THREE.MathUtils.radToDeg(continuousTwistAngle).toFixed(1),
        twistReal: 0//THREE.MathUtils.radToDeg(twistApplied).toFixed(1)
    };
}
// Compute and restric hand rotations 
function computeQuatHand( skeleton, handLandmarks, isLeft = false, deltaTime ){
    if ( !handLandmarks ){ return false; }

    const boneHand = isLeft ? skeleton.bones[ 12 ] : skeleton.bones[ 36 ];
    const boneMid = isLeft ? skeleton.bones[ 21 ] : skeleton.bones[ 45 ];
    const bonePinky = isLeft ? skeleton.bones[ 29 ] : skeleton.bones[ 37 ];
    const boneIndex = isLeft ? skeleton.bones[ 17 ] : skeleton.bones[ 49 ];
    const boneForearm = boneHand.parent;
    boneHand.updateWorldMatrix( true, false );

    // 1. Get bind pose if its not saved
    if (!boneHand.userData.bindPoseData) {
        // Matrius World Inverses originals
        let invHandMat = isLeft ? skeleton.boneInverses[ 12 ].clone() : skeleton.boneInverses[ 36 ].clone();
        let invParentMat = isLeft ? skeleton.boneInverses[ 11 ].clone() : skeleton.boneInverses[ 35 ].clone();
        let invMidMat = isLeft ? skeleton.boneInverses[ 21 ].clone() : skeleton.boneInverses[ 45 ].clone();

        // Local rotation of the hand in bind pose respect to parent (forearm)
        let handBindMatLocal = invParentMat.clone().multiply( invHandMat.clone().invert() );
        let dummyPos = new THREE.Vector3(), dummyScale = new THREE.Vector3();
        let bindPoseQuat = new THREE.Quaternion();
        handBindMatLocal.decompose(dummyPos, bindPoseQuat, dummyScale);

        // Local position of the middle finger in bind pose respect to the hand
        // World matrix of the hand in bind pose
        let handWorldBindMat = invHandMat.clone().invert(); 
        // World matrix of the middle finger in bind pose
        let midWorldBindMat = invMidMat.clone().invert();   
        
        // Local matrix of the middle finger respect to the hand in bind pose
        let midLocalBindMat = invHandMat.clone().multiply( midWorldBindMat );
        
        let bindMidLocalPos = new THREE.Vector3();
        let bindMidLocalQuat = new THREE.Quaternion();
        midLocalBindMat.decompose(bindMidLocalPos, bindMidLocalQuat, dummyScale);

        // Save pure data of bind pose
        boneHand.userData.bindPoseData = {
            bindPoseQuat: bindPoseQuat,                             // local neutral rotation of hand
            dirMidBoneBind: bindMidLocalPos.clone().normalize(),     // original direcction vector of the middle finger in bind pose
            bindMidLocalQuat: bindMidLocalQuat,
            lastRawTwist: 0
        };
    }

    const bindData = boneHand.userData.bindPoseData;
    const { bindPoseQuat, dirMidBoneBind } = bindData;

    // 2. Parent in world space (forearm)
    boneForearm.updateWorldMatrix(true, false);
    let forearmWorldQuat = new THREE.Quaternion();
    let _dummy = new THREE.Vector3();
    boneForearm.matrixWorld.decompose(_dummy, forearmWorldQuat, _dummy);
    let invForearmWorldQuat = forearmWorldQuat.clone().invert();

    // 3. Compute swing respect to bind pose
    let dirMidBindInParent = dirMidBoneBind.clone().applyQuaternion(bindPoseQuat).normalize();

    let mcMidPred = new THREE.Vector3().subVectors(handLandmarks[9], handLandmarks[0]);
    mcMidPred.applyQuaternion(invForearmWorldQuat).normalize();

    let qSwingBind = new THREE.Quaternion();
    qSwingBind.setFromUnitVectors(dirMidBindInParent, mcMidPred);
    if (qSwingBind.w < 0) {
        qSwingBind.conjugate();
        qSwingBind.w *= -1;
    }

    let swingAngleReq = 2 * Math.acos(Math.min(Math.abs(qSwingBind.w), 1.0));

    // 3. Restrict asymetric swing rotation (up/down vs sides)
    // Anatomic limits in rad 
    const maxPitchUp = THREE.MathUtils.degToRad(90);   // Up (felxion) ~75°
    const maxPitchDown = THREE.MathUtils.degToRad(90); // Down (extension) ~65°
    const maxYawSide = THREE.MathUtils.degToRad(45);   // Sides (lateral deviation) ~25°

    // Get rotation axis of swing in local space
    let swingAxis = new THREE.Vector3(qSwingBind.x, qSwingBind.y, qSwingBind.z);
    let swingAxisLen = swingAxis.length();

    let swingAngleApplied = swingAngleReq;

    if (swingAxisLen > 0.0001 && swingAngleReq > 0.0001) {
        swingAxis.normalize();

        // Project axis over local components (Pitch = X/Z, Yaw = Y)
        // Compute angle components
        let pitchComponent = swingAxis.x * swingAngleReq; // up/dopwn
        let yawComponent = swingAxis.z * swingAngleReq;   // sides

        // Vertical limit depending of up or down 
        let limitPitch = (pitchComponent >= 0) ? maxPitchUp : maxPitchDown;
        let limitYaw = maxYawSide;

        // Elipse equation: (pitch/limitP)^2 + (yaw/limitY)^2
        let normPitch = pitchComponent / limitPitch;
        let normYaw = yawComponent / limitYaw;
        let ellipseDistance = Math.sqrt(normPitch * normPitch + normYaw * normYaw);

        // If its outside of elipse (distance > 1.0), clampem angle
        if (ellipseDistance > 1.0) {
            let scaleFactor = 1.0 / ellipseDistance;
            swingAngleApplied = swingAngleReq * scaleFactor;

            // Recompute swing quaternion
            qSwingBind.slerp(new THREE.Quaternion(), 1.0 - (swingAngleApplied / swingAngleReq));
        }
    }

    let qSwingApplied = qSwingBind.clone().multiply(bindPoseQuat);

    // 4. Compute twist in post-swing space (unwrap & antiflip)
    let invWorldQuatForTwist = invForearmWorldQuat.clone().premultiply(qSwingApplied.clone().invert());

    let mcPinkyPred = new THREE.Vector3().subVectors(handLandmarks[17], handLandmarks[0]);
    let mcIndexPred = new THREE.Vector3().subVectors(handLandmarks[5], handLandmarks[0]);
    
    let palmDirPred = new THREE.Vector3().crossVectors(mcPinkyPred, mcIndexPred).normalize();
    arrowFrontComputed.setDirection(palmDirPred)
    palmDirPred.applyQuaternion(invWorldQuatForTwist);
    let palmDirBone = new THREE.Vector3().crossVectors(bonePinky.position, boneIndex.position).normalize();
    arrowFront.setDirection(palmDirBone)
    
    // Projection of orthogonal plane to finger
    palmDirPred.addScaledVector(dirMidBoneBind, -palmDirPred.dot(dirMidBoneBind)).normalize();
    palmDirBone.addScaledVector(dirMidBoneBind, -palmDirBone.dot(dirMidBoneBind)).normalize();
    arrowFrontLocalComputed.setDirection(palmDirPred)

    let twistCos = THREE.MathUtils.clamp(palmDirBone.dot(palmDirPred), -1.0, 1.0);
    let twistSin = new THREE.Vector3().crossVectors(palmDirBone, palmDirPred).dot(dirMidBoneBind);
    let rawTwistAngle = Math.atan2(twistSin, twistCos);

    // Continuity filter (unwrap)
    let deltaTwist = rawTwistAngle - bindData.lastRawTwist;
    while (deltaTwist > Math.PI) deltaTwist -= Math.PI * 2;
    while (deltaTwist < -Math.PI) deltaTwist += Math.PI * 2;

    let continuousTwistAngle = bindData.lastRawTwist + deltaTwist;
    bindData.lastRawTwist = continuousTwistAngle;

    // 5. Anatomic twsit limit (75°)
    const maxAbsoluteTwistRad = THREE.MathUtils.degToRad(75);
    let twistApplied = THREE.MathUtils.clamp(continuousTwistAngle, -maxAbsoluteTwistRad, maxAbsoluteTwistRad);

    let qTwistFinal = new THREE.Quaternion().setFromAxisAngle(dirMidBoneBind, twistApplied);
    let qTarget = qSwingApplied.clone().multiply(qTwistFinal).normalize();

    if (boneHand.quaternion.dot(qTarget) < 0) {
        qTarget.conjugate();
        qTarget.w *= -1;
    }

    boneHand.quaternion.copy(qTarget);

    return {
        swingReq: THREE.MathUtils.radToDeg(swingAngleReq).toFixed(1),
        swingReal: THREE.MathUtils.radToDeg(swingAngleApplied).toFixed(1),
        twistReq: THREE.MathUtils.radToDeg(continuousTwistAngle).toFixed(1),
        twistReal: THREE.MathUtils.radToDeg(twistApplied).toFixed(1)
    };
}

function createBodyAnimationFromWorldLandmarks( worldLandmarksArray, skeleton, i, bindQuats ){
    function getTwistQuaternion( q, normAxis, outTwist ){
        let dot =  q.x * normAxis.x + q.y * normAxis.y + q.z * normAxis.z;
        outTwist.set( dot * normAxis.x, dot * normAxis.y, dot * normAxis.z, q.w )
        outTwist.normalize(); // already manages (0,0,0,0) quaternions by setting identity
        return outTwist;
    }

    function computeSpine( skeleton, bindQuats, bodyLandmarks ){
        if ( !bodyLandmarks ){ return; }
        //bodyLandmarks is an array of {x,y,z,visiblity} (mediapipe)

        const boneHips = skeleton.bones[ 0 ];
        boneHips.quaternion.copy( bindQuats[ 0 ] );
        const boneSpine0 = skeleton.bones[ 1 ]; // connected to hips
        boneSpine0.quaternion.copy( bindQuats[ 1 ] );
        const boneSpine1 = skeleton.bones[ 2 ];
        boneSpine1.quaternion.copy( bindQuats[ 2 ] );
        const boneSpine2 = skeleton.bones[ 3 ];
        boneSpine2.quaternion.copy( bindQuats[ 3 ] );
        const boneLeftLeg = skeleton.bones[ 57 ]; // connected to hips
        const boneRightLeg = skeleton.bones[ 62 ]; // connected to hips


        boneHips.updateWorldMatrix( true, true );

        const landmarkHipsLeft = bodyLandmarks[ 23 ];
        const landmarkHipsRight = bodyLandmarks[ 24 ];
        const landmarkShoulderLeft = bodyLandmarks[ 11 ];
        const landmarkShoulderRight = bodyLandmarks[ 12 ];
        const landmarkHipsMid = new THREE.Vector3(0,0,0);
        const landmarkShoulderMid = new THREE.Vector3(0,0,0);
        let dirHipsPred = ( new THREE.Vector3() ).subVectors( landmarkHipsRight, landmarkHipsLeft ); 
        let dirShoulderPred = ( new THREE.Vector3() ).subVectors( landmarkShoulderRight, landmarkShoulderLeft ); 
        landmarkHipsMid.addScaledVector( dirHipsPred, 0.5).add( landmarkHipsLeft );
        landmarkShoulderMid.addScaledVector( dirShoulderPred, 0.5).add( landmarkShoulderLeft );
        let dirSpinePred = ( new THREE.Vector3() ).subVectors( landmarkShoulderMid, landmarkHipsMid ).normalize();

        const dirBone = new THREE.Vector3();
        const _ignoreVec3 = new THREE.Vector3();
        const invWorldQuat = new THREE.Quaternion();
        const qq = new THREE.Quaternion();
        const tempQuat = new THREE.Quaternion();
        
        // hips
        boneHips.matrixWorld.decompose( _ignoreVec3, invWorldQuat, _ignoreVec3 );
        invWorldQuat.invert();

        dirHipsPred.applyQuaternion( invWorldQuat ).normalize(); // world direction to local hips space
        dirBone.subVectors( boneRightLeg.position, boneLeftLeg.position ).normalize(); // Local hips space
        qq.setFromUnitVectors( dirBone, dirHipsPred ).normalize();
        let twist = getTwistQuaternion( qq, dirBone, tempQuat ); // remove unwanted roll forward/backward
        qq.multiply( twist.invert() );
        boneHips.quaternion.multiply( qq );
        invWorldQuat.premultiply( qq.invert() );

        // spine
        dirSpinePred.applyQuaternion( invWorldQuat ); // world direction to local hips space
        boneSpine2.updateWorldMatrix( true, false );
        dirBone.setFromMatrixPosition( boneSpine2.matrixWorld ); // world position of shoulders union
        dirBone.applyMatrix4( boneHips.matrixWorld.clone().invert() ); //world position to local direction hips space
        qq.setFromUnitVectors( dirBone, dirSpinePred ).normalize();
        // divide final rotation into for offset (one for each hips-spine bone) (nlerp with identityQuat)
        let f= 1.0/4.0;
        qq.x = qq.x * f;
        qq.y = qq.y * f;
        qq.z = qq.z * f;
        qq.w = qq.w * f + 1 * (1-f);
        qq.normalize();
        boneHips.quaternion.multiply(qq);

        // move qq from left_spine0_Quat to right_spine_Quat.  
        // Q = (hips * qq) * spine0Quat = hips * (qq * spine0Quat) = hips * spine0Quat * qq'
        qq.multiply( boneSpine0.quaternion ).premultiply( tempQuat.copy( boneSpine0.quaternion ).invert() );
        boneSpine0.quaternion.multiply( qq );

        // Q = (spine0Quat * qq') * spine1Quat = spine0Quat * (qq' * spine1Quat) = spine0Quat * spine1Quat * qq''
        qq.multiply( boneSpine1.quaternion ).premultiply( tempQuat.copy( boneSpine1.quaternion ).invert() );
        boneSpine1.quaternion.multiply( qq );

        // // Q = (spine1Quat * qq'') * spine2Quat = spine1Quat * (qq'' * spine2Quat) = spine1Quat * spine2Quat * qq'''
        // qq.multiply( boneSpine2.quaternion ).premultiply( tempQuat.copy( boneSpine2.quaternion ).invert() );
        // boneSpine2.quaternion.multiply( qq );
        boneSpine2.quaternion.premultiply( qq );
    }

    function computeQuatHead( skeleton, bindQuats, bodyLandmarks ){
        if ( !bodyLandmarks ){ return; }
        //bodyLandmarks is an array of {x,y,z,visiblity} (mediapipe)

        let tempVec3 = new THREE.Vector3();
        let qq = new THREE.Quaternion();

        const boneHead = skeleton.bones[ 5 ]; // head
        boneHead.quaternion.copy( bindQuats[ 5 ] );
        let boneHeadTop = boneHead; // head top, must be a children of head
        for(let i = 0; i < boneHead.children.length; i++) {
            if(boneHead.children[i].name.toLowerCase().includes('eye')) {
                continue;
            }
            boneHeadTop = boneHead.children[i];
            break;
        }
        boneHead.updateWorldMatrix( true, false );
        // character bone local space direction
        let headBoneDir = boneHeadTop.position.clone().normalize();

        // world space
        let earsDirPred = (new THREE.Vector3()).subVectors( bodyLandmarks[8], bodyLandmarks[7] ).normalize();
        let earNoseDirPred = (new THREE.Vector3()).subVectors( bodyLandmarks[0], bodyLandmarks[7] ).normalize();
        let upHeadDirPred = (new THREE.Vector3()).crossVectors( earsDirPred, earNoseDirPred ).normalize(); // will change to local
        let forwardHeadDirPred = (new THREE.Vector3()).crossVectors( upHeadDirPred, earsDirPred ).normalize();
        
        boneHead.matrixWorld.decompose( tempVec3, qq, tempVec3 );
        qq.invert(); // invWorldQuat
        upHeadDirPred.applyQuaternion( qq ).normalize(); // local space
    
        // move head to predicted direction (SWING)
        qq.setFromUnitVectors( headBoneDir, upHeadDirPred );
        boneHead.quaternion.multiply( qq )
        getTwistQuaternion( qq, headBoneDir, qq ); // unwanted twist from the swing operation
        boneHead.quaternion.multiply( qq.invert() ).normalize(); // remove twist
        
        // compute head roll (TWIST)
        tempVec3.set(-1,0,0); // because of mediapipe points
        let angle = Math.acos( forwardHeadDirPred.dot( tempVec3 ) ); // computing in world space
        angle -= Math.PI/2;
        qq.setFromAxisAngle( headBoneDir, angle ); // angle does not which space is in
        boneHead.quaternion.multiply( qq ).normalize();
    }

    function computeQuatArm( skeleton, bodyLandmarks, isLeft = false ){
        if ( !bodyLandmarks ){ return; }
        //bodyLandmarks is an array of {x,y,z,visiblity} (mediapipe)

        let twist = new THREE.Quaternion();

        for( let i = 0; i < (landmarks.length-1); ++i ){
            let boneSrc = skeleton.bones[ boneIdxs[ i ] ];

            let landmarkSrc = bodyLandmarks[ landmarks[i] ];

            boneSrc.matrixWorld.decompose( _ignoreVec3, invWorldQuat, _ignoreVec3 );

            // world mediapipe bone direction to local space
            dirPred.subVectors( landmarkTrg, landmarkSrc );
            dirPred.applyQuaternion( invWorldQuat ).normalize();

            // character bone local space direction
            dirBone.copy( boneTrg.position ).normalize();

            // move bone to predicted direction
            qq.setFromUnitVectors( dirBone, dirPred );
            boneSrc.quaternion.multiply( qq );
            getTwistQuaternion( qq, dirBone, twist ); // remove undesired twist from bone
            boneSrc.quaternion.multiply( twist.invert() ).normalize();
        }
    }

        const handForward = (new THREE.Vector3()).addScaledVector(tempVec3_1,0.5).addScaledVector(tempVec3_2,0.5); // direction of fingers
        const handNormal = (new THREE.Vector3()).crossVectors(tempVec3_2,tempVec3_1).normalize(); // on right hand and left hand, direction from back of hand outwards
        const handSide = (new THREE.Vector3()).crossVectors(handNormal,handForward).normalize(); // on right hand, direction from center of hand to thumb side. On left hand, direction form center of hand to pinky side
        if ( isLeft ){
            handNormal.multiplyScalar(-1);
            handSide.multiplyScalar(-1);
        }

        const prevForward = new THREE.Vector3();
        const prevNormal = new THREE.Vector3();
        const prevSide = new THREE.Vector3();

        const maxLateralDeviation = Math.cos(60 * Math.PI/180);
        const latDevQuat = new THREE.Quaternion();
        const latDevNormal = new THREE.Vector3();

        // for each finger (and thumb)
        for( let f = 1; f < handLandmarks.length; f+=4){

            // fingers can slightly move laterally. Compute the mean lateral movement of the finger
            let meanSideDeviation = 0;
            tempVec3_1.subVectors(handLandmarks[f+1], handLandmarks[f+0]).normalize();
            meanSideDeviation += handSide.dot(tempVec3_1) * 1/3;
            const fingerBend = handNormal.dot(tempVec3_1);
            tempVec3_1.subVectors(handLandmarks[f+2], handLandmarks[f+1]).normalize();
            meanSideDeviation += handSide.dot(tempVec3_1) * 1/3;
            tempVec3_1.subVectors(handLandmarks[f+3], handLandmarks[f+2]).normalize();
            meanSideDeviation += handSide.dot(tempVec3_1) * 1/3;
            
            if (Math.abs(meanSideDeviation) > maxLateralDeviation){
                meanSideDeviation = (meanSideDeviation < 0) ? -maxLateralDeviation : maxLateralDeviation;
            }
            if ( fingerBend < 0){ // the more the finger is bended, the less it can be moved sideways
                meanSideDeviation *= 1+fingerBend;
            }
            // end of lateral computations

            // phalanges can bend. Thus, reference vectors need to be with respect to the last phalange (or the base of the hand)
            prevForward.copy(handForward);
            prevSide.copy(handSide);
            prevNormal.copy(handNormal);

            // for each phalange of each finger (and thumb)
            for( let i = 0; i < 3; ++i){
                const boneSrc = skeleton.bones[ bonePhalanges[ f + i-1 ] ];
                const boneTrg = skeleton.bones[ bonePhalanges[ f + i ] ];
                const landmark = f + i;
                boneSrc.quaternion.copy( bindQuats[ bonePhalanges[ f+i-1 ] ] );
                boneSrc.updateWorldMatrix( true, false );
            
                // world mediapipe phalange direction
                let v_phalange = new THREE.Vector3();
                v_phalange.subVectors( handLandmarks[landmark+1], handLandmarks[landmark] ).normalize();

                // fingers (no thumb). All lateral deviation is removed and added later on
                if ( f > 4 ){
                    // remove all lateral deviation (later will add the allowed one)
                    v_phalange.addScaledVector(handSide, -v_phalange.dot(handSide));
                    if (v_phalange.length() < 0.0001 ){
                        v_phalange.copy(prevForward);
                    }else{
                        v_phalange.normalize();
                    }

                    // prevForward and prevNormal do not have any lateral deviation
                    const dotForward = v_phalange.dot(prevForward);
                    const dotNormal = v_phalange.dot(prevNormal);
                    
                    // finger cannot bend uppwards
                    if (dotNormal > 0){
                        v_phalange.copy( prevForward );
                    }else{
                        const limitForward = -0.76; // cos 40º
                        const limitNormal = -0.64; // sin 40º
                        // too much bending, restrict it (set default bended direction)
                        if ( dotForward < limitForward ){ 
                            v_phalange.set(0,0,0);
                            v_phalange.addScaledVector( prevForward, limitForward);
                            v_phalange.addScaledVector( prevNormal, limitNormal);
                        }
                    }
    
                    v_phalange.normalize();
            
                    prevNormal.crossVectors( v_phalange, handSide ).normalize();
                    prevForward.copy(v_phalange); // without any lateral deviation

                    // store lateral deviation rotation axis. As the finger could be bent, the fingerNormal and handNormal do not necessarily match. 
                    if ( i == 0 ){
                        latDevNormal.copy( prevNormal );
                    }
                }
                else {
                    // thumb
                    if (i==0){
                        // base of thumb
                        const dotthumb = v_phalange.dot(handNormal);
                        const mint = -0.45;
                        const maxt = 0.0;
                        if ( dotthumb > maxt || dotthumb < mint ){
                            const clampDot = Math.max(mint, Math.min(maxt, dotthumb));
                            v_phalange.addScaledVector(handNormal, -dotthumb + clampDot);
                        }
                        prevForward.copy(handForward);
                        prevSide.copy(handNormal); // swap
                        prevNormal.copy(handSide); // swap
                        if ( isLeft ){
                            prevNormal.multiplyScalar(-1);                            
                        }
                    }
                    else{
                        // other thumb bones
                        // remove lateral deviation
                        v_phalange.addScaledVector(prevSide, -v_phalange.dot(prevSide));
                        
                        // cannot bend on that direction
                        const dotNormal = v_phalange.dot(prevNormal);
                        if (dotNormal > 0){
                            v_phalange.addScaledVector(prevNormal, -dotNormal)
                        }        
                    }

                    v_phalange.normalize();
    
                    if (v_phalange.length() < 0.0001 ){
                        v_phalange.copy(prevForward);
                    }
    
                    // update previous directions with the current ones
                    if ( isLeft ){
                        prevNormal.crossVectors( v_phalange, prevSide ).normalize();
                        prevSide.crossVectors( prevNormal, v_phalange ).normalize();
                        prevForward.copy(v_phalange);
                    }else{
                        prevNormal.crossVectors( prevSide, v_phalange ).normalize();
                        prevSide.crossVectors( v_phalange, prevNormal ).normalize();
                        prevForward.copy(v_phalange);
                    }
                }


                boneSrc.matrixWorld.decompose( tempVec3_1, invWorldQuat, tempVec3_1 );
                invWorldQuat.invert();
                // world phalange direction to local space
                v_phalange.applyQuaternion( invWorldQuat ).normalize();
    
                // character bone local space direction
                let phalange_p = boneTrg.position.clone().normalize();
    
                // move bone to predicted direction
                const rot = new THREE.Quaternion();
                const twist = new THREE.Quaternion();
                rot.setFromUnitVectors( phalange_p, v_phalange );
                getTwistQuaternion( rot, phalange_p, twist ); // remove undesired twist from phalanges
                boneSrc.quaternion.multiply( rot ).multiply( twist.invert() ).normalize();
            }// end of phalange for

            // add lateral deviation for fingers, only on the base bone. Right now, fingers are all in the plane ( Normal x Forward )
            if( f > 4 ){
                const boneSrc = skeleton.bones[ bonePhalanges[ f-1 ] ];
                boneSrc.updateMatrixWorld(true);
                let q = new THREE.Quaternion();
                boneSrc.matrixWorld.decompose(tempVec3_1, q, tempVec3_1);
                latDevNormal.applyQuaternion( q.invert() );
                latDevQuat.setFromAxisAngle( latDevNormal, (Math.PI-Math.acos(meanSideDeviation)) - Math.PI*0.5);
                boneSrc.quaternion.multiply(latDevQuat);
            }
        } // end of finger 'for'
    };

    // skeleton.pose(); // bind pose

    let tracks = [];

    let times = new Float32Array( worldLandmarksArray.length );


    // for each frame compute and update quaternions
        let body = worldLandmarksArray[i].PWLM;
        let rightHand = worldLandmarksArray[i].RWLM;
        let leftHand = worldLandmarksArray[i].LWLM;

        computeSpine( skeleton, bindQuats, body );
        computeQuatHead( skeleton, bindQuats, body );

        // // right arm-hands
        let metrics = null;
        // computeQuatArm( skeleton, body, false );
        // if(worldLandmarksArray[i].rightHandVisibility > 0.4) {
        //     metrics = computeQuatHandOriginal( skeleton, rightHand, false, worldLandmarksArray[i].dt/1000 );
        //     if( metrics ) {
        //         computeQuatPhalange( skeleton, bindQuats, rightHand, false );
        //     }
        // //     if(computeQuatHandOriginal( skeleton, rightHand, false,  worldLandmarksArray[i].dt/1000)) {

        // //         // computeQuatPhalange( skeleton, bindQuats, rightHand, false );
        // //     }
        // //     else {
        // //         console.log("hand:", "rightHand", "time:", timeAcc, "frame:", i)
        // //     }
        // }
        
        // left arm-hands
        computeQuatArm( skeleton, body, true );
        if(worldLandmarksArray[i].leftHandVisibility > 0.4) {
            metrics = computeQuatHandOriginal( skeleton, leftHand, true, worldLandmarksArray[i].dt/1000 );
            if( metrics ) {
                computeQuatPhalange( skeleton, bindQuats, leftHand, true );
            }

            // if(computeQuatHandOriginal( skeleton, leftHand, true, worldLandmarksArray[i].dt/1000 )) {
            //     // computeQuatPhalange( skeleton, bindQuats, leftHand, true );
            // }
            // else {
            //     console.log("hand:", "leftHand", "time:", timeAcc, "frame:", i)
            // }
        }
        return metrics;

}

function processLandmarks( faceData, poseData, handsData, dt = 0 ) {

    const results = {
        dt: dt, 
        FLM: null,

        RLM: null, // image 2d landmarks each landmarks with { x, y, z, visibility } 
        LLM: null, 
        PLM: null, 
        
        RWLM: null, // world 3d landmarks each landmarks with { x, y, z, visibility }
        LWLM: null, 
        PWLM: null, 
        distanceToCamera: 0,
        rightHandVisibility: 0, 
        leftHandVisibility: 0
    };

    if ( handsData ) {
        for ( let i = 0; i < handsData.handednesses.length; ++i ) {
            let h = handsData.handednesses[i][0];
            let landmarks = handsData.landmarks[ i ]
            let worldLandmarks = handsData.worldLandmarks[ i ];
            if ( h.categoryName == 'Left' ) {
                // let visibility = 0;
                // landmarks.forEach( l => visibility+=l.visibility);
                // visibility /= landmarks.length;
                // if( visibility > 0.3 ) {
                    results.LLM = landmarks; results.LWLM = worldLandmarks;
                // }
            }
            else {
                // let visibility = 0;
                // landmarks.forEach( l => visibility+=l.visibility);
                // visibility /= landmarks.length;
                // if( visibility > 0.3 ) {
                    results.RLM = landmarks; results.RWLM = worldLandmarks;
                // }
            }
        }
    }

    if ( faceData && faceData.faceLandmarks.length ) {
        results.FLM = faceData.faceLandmarks[0];
    }

    if ( poseData && poseData.landmarks.length ) {
        const landmarks = poseData.landmarks[0];
        const worldLandmarks = poseData.worldLandmarks[0];
        results.PLM = landmarks;
        results.PWLM = worldLandmarks;
        results.distanceToCamera = (landmarks[23].visibility + landmarks[24].visibility)*0.5;
        results.leftHandVisibility = !!results.LLM * (landmarks[15].visibility + landmarks[17].visibility + landmarks[19].visibility)/3;
        results.rightHandVisibility = !!results.RLM * (landmarks[16].visibility + landmarks[18].visibility + landmarks[20].visibility)/3;
    }
            
    return results;
}

function smoothMediapipeLandmarks( inLandmarks  ){
    let outLandmarks = JSON.parse(JSON.stringify(inLandmarks));

    let arrayToSmoothX = new Array( inLandmarks.length );
    let arrayToSmoothY = new Array( inLandmarks.length );
    let arrayToSmoothZ = new Array( inLandmarks.length );

    let attributesToSmooth = [ "PWLM", "LWLM", "RWLM" ];
    
    for( let group of attributesToSmooth ){

        let initialValues = null;
        for( let f = 0; f < inLandmarks.length; ++f ){
            if ( !inLandmarks[f][group] ){ continue; }
            initialValues = inLandmarks[f][group];
            break;
        }
        if ( !initialValues ){
            return outLandmarks;
        }

        // for each landmark
        for(let l = 0; l < initialValues.length; ++l ){

            
            //for each frame get the value to smooth (or a default one)
            let values = initialValues[l]; // default values in case there is no landmark estimation for a frame
            for( let f = 0; f < inLandmarks.length; ++f ){

                if (outLandmarks[f] && outLandmarks[f][group] ){
                    values = outLandmarks[f][group][l];  // found a valid landmark, set it as default
                }
                arrayToSmoothX[f] = values.x;
                arrayToSmoothY[f] = values.y;
                arrayToSmoothZ[f] = values.z;

            }

            const smoothX = mlSavitzkyGolay(arrayToSmoothX, 1, { windowSize: 9, polynomial: 3, derivative: 0, pad: 'pre', padValue: 'replicate' }); //https://www.skypack.dev/view/ml-savitzky-golay
            const smoothY = mlSavitzkyGolay(arrayToSmoothY, 1, { windowSize: 9, polynomial: 3, derivative: 0, pad: 'pre', padValue: 'replicate' }); //https://www.skypack.dev/view/ml-savitzky-golay
            const smoothZ = mlSavitzkyGolay(arrayToSmoothZ, 1, { windowSize: 9, polynomial: 3, derivative: 0, pad: 'pre', padValue: 'replicate' }); //https://www.skypack.dev/view/ml-savitzky-golay

            //for each frame, set smoothed values
            for( let f = 0; f < inLandmarks.length; ++f ){
                if (outLandmarks[f] && outLandmarks[f][group] ){
                    let values = outLandmarks[f][group][l];
                    values.x = smoothX[f];
                    values.y = smoothY[f];
                    values.z = smoothZ[f];
                }

            } 
        } // end of landmark
    } // end of attribute

    return outLandmarks;
}

async function handleFile( file ) {

     const text = await file.text();
    try {
        let data = JSON.parse(text);
        data = data.data;
        landmarks = [];
        for( let i = 0; i < data.length; i++) {
            landmarks.push(processLandmarks(  data[i].detectionsFace, data[i].detectionsPose, data[i].detectionsHands));
        }
        landmarks = smoothMediapipeLandmarks(landmarks);
        skeleton.pose();

        for( let i = 0; i < skeleton.bones.length; ++i ){
            // tracks.push( new Float32Array( worldLandmarksArray.length * 4 ) );
            bindQuats.push( skeleton.bones[i].quaternion.clone() );
        }
    }
    catch( erorr ){
        console.error(error);
    }
}

// Anul·lar el comportament per defecte a nivell de document i finestra
function preventDefaults(e) {
    e.preventDefault();
    e.stopPropagation();
}

// Utilitzem 'true' (fase de captura) per garantir que la finestra rebi l'esdeveniment abans que qualsevol altre element (com el canvas 3D)
['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    window.addEventListener(eventName, preventDefaults, true);
    document.addEventListener(eventName, preventDefaults, true);
});

window.addEventListener('dragenter', (e) => {
    dragCounter++;
    dropOverlay.classList.add('active');
}, true);

window.addEventListener('dragleave', (e) => {
    dragCounter--;
    if (dragCounter <= 0) {
        dragCounter = 0;
        dropOverlay.classList.remove('active');
    }
}, true);

window.addEventListener('drop', (e) => {
    dragCounter = 0;
    dropOverlay.classList.remove('active');

    const dt = e.dataTransfer;
    if (dt && dt.files && dt.files.length > 0) {
        handleFile(dt.files[0]);
    }
}, true);

fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) {
        handleFile(e.target.files[0]);
    }
});

let recompute = false;
document.onkeydown = (e) => {
    if(!landmarks) {
        return;
    }
    switch(e.key) {
        case "ArrowRight":
            frame++;
            changeFrame(frame);
            break;
        case "ArrowLeft":
            frame--;
            changeFrame(frame);
            break;
        case "T": case "t":
            computeTwist = !computeTwist;
            changeTwistComputationsState( computeTwist );
    }
}
const timeInput = document.getElementById("time");
const frameInput = document.getElementById("frame");
frameInput.onchange = (e) => {
    changeFrame(e.target.value);
}
function changeFrame(v) {
    frame = v;
    frame = THREE.MathUtils.clamp(frame, 0, landmarks.length-1)
    frameInput.value = frame;
    recompute = true;
    timeInput.innerText = timeAcc = frame*(landmarks[frame].dt|| 40)/1000;;
}
